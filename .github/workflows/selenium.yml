name: Selenium Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Get the project code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Selenium tests
        run: mvn --batch-mode test
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-test-evidence
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: warn
          retention-days: 7